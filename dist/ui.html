<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; padding: 16px; font-size: 12px; background: var(--figma-color-bg); color: var(--figma-color-text); }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 14px; color: var(--figma-color-text-secondary); }
    button { width: 100%; border: 0; border-radius: 6px; padding: 10px 12px; font-weight: 600; cursor: pointer; background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); }
    button.secondary { margin-top: 8px; background: var(--figma-color-bg-secondary); color: var(--figma-color-text); }
    #status { margin-top: 12px; white-space: pre-wrap; }
    #warnings { margin-top: 10px; padding: 8px; border-radius: 6px; background: var(--figma-color-bg-warning-tertiary); color: var(--figma-color-text-warning); max-height: 180px; overflow: auto; display: none; }
    .ok { color: var(--figma-color-text-success); }
    .err { color: var(--figma-color-text-danger); }
  </style>
</head>
<body>
  <h1>Figzen</h1>
  <p>Select a Frame, then export it as an editable Godot 4 scene.</p>
  <button id="export">Export selected Frame</button>
  <button id="close" class="secondary">Close</button>
  <div id="status"></div>
  <div id="warnings"></div>
<script>
  const status = document.getElementById('status');
  const warnings = document.getElementById('warnings');
  document.getElementById('export').onclick = () => parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
  document.getElementById('close').onclick = () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*');

  parent.postMessage({ pluginMessage: { type: 'ready' } }, '*');

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg || msg.type !== 'result') return;
    if (!msg.ok) {
      status.className = 'err';
      status.textContent = msg.error || 'Export failed.';
      warnings.style.display = 'none';
      return;
    }
    downloadZip(msg.filename, msg.content, msg.warnings || []);
  };

  async function downloadZip(filename, content, warningList) {
    status.className = 'ok';
    status.textContent = `Exported ${filename}. Preparing ZIP…`;
    warnings.style.display = 'none';

    const zip = createZip([{ name: filename, data: new TextEncoder().encode(content) }]);
    const blob = new Blob([zip], { type: 'application/zip' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename.replace(/\.tscn$/i, '') + '.zip';
    a.click();
    URL.revokeObjectURL(url);

    status.textContent = `Downloaded ${a.download}`;
    if (warningList.length) {
      warnings.style.display = 'block';
      warnings.textContent = warningList.map(w => `• ${w.node}: ${w.message}`).join('\n');
    }
  }

  // Minimal ZIP writer: one or more stored files, no external library.
  function createZip(files) {
    const encoder = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;
    const now = new Date();
    const { time, date } = dosDateTime(now);

    for (const file of files) {
      const name = encoder.encode(file.name);
      const crc = crc32(file.data);
      const local = concat([
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(time), u16(date), u32(crc), u32(file.data.length), u32(file.data.length), u16(name.length), u16(0), name
      ]);
      chunks.push(local, file.data);
      central.push(concat([
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(time), u16(date), u32(crc), u32(file.data.length), u32(file.data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), name
      ]));
      offset += local.length + file.data.length;
    }

    const centralBytes = concat(central);
    const end = concat([u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(centralBytes.length), u32(offset), u16(0)]);
    return concat([...chunks, centralBytes, end]);
  }

  function dosDateTime(d) {
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    return { time, date };
  }
  function u16(n) { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, n, true); return b; }
  function u32(n) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n >>> 0, true); return b; }
  function concat(parts) { const len = parts.reduce((n, p) => n + p.length, 0); const out = new Uint8Array(len); let i = 0; for (const p of parts) { out.set(p, i); i += p.length; } return out; }
  const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function crc32(bytes) { let c = 0xffffffff; for (const b of bytes) c = crcTable[(c ^ b) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
</script>
</body>
</html>
